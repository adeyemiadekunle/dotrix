[project]
name = "pmagent-engine"
version = "0.1.0"
description = "UI-agnostic pmagent engine: PM + thinking agents, issues, approvals, jobs, ingestion."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.19,<0.8",
    "pyyaml",
    "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.8",
    "langgraph-checkpoint-sqlite",
    "filelock",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.0",
    "langchain-google-genai>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmagent_engine"]
