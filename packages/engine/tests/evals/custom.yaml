- name: a custom agent's allowed comment doesn't pause, its blocked action is gone
  agent: triage
  spec:
    handle: triage
    name: Triage
    instructions: Comment on issues.
    tools: [board.read, issues.create, issues.comment]
    issue_types: [bug]
    autonomy: { issues.comment: allow, issues.create: block }
  message: triage KUN-1
  script:
    - tool: comment_issue
      args: { key: KUN-1, text: Duplicate of KUN-2. }
    - text: Commented.
  expect:
    tools_include: [comment_issue, list_issues]
    tools_exclude: [create_issue]
    pending: []
    reply: Commented.

- name: a result that doesn't fit its schema is sent back
  agent: security
  spec:
    handle: security
    name: Security reviewer
    instructions: Look for risks.
    output: finding
  message: review
  script:
    - tool: submit_result
      args: { items: [{ title: No severity }] }
    - tool: submit_result
      args: { items: [{ severity: low, title: Verbose errors, detail: Stack traces reach clients }] }
    - text: One finding.
  expect:
    tools_include: [submit_result]
    results: 1
    tool_errors: 1
    reply: One finding.
