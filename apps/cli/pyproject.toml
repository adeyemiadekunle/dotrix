[project]
name = "pmagent"
version = "0.1.0"
description = "pmagent terminal client and MCP server for Claude Code / Codex."
requires-python = ">=3.11"
dependencies = [
    "pmagent-engine",
    "typer",
    "mcp>=1.2",
]

[project.scripts]
pmagent = "pmagent_cli.cli:app"

[tool.uv.sources]
pmagent-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmagent_cli"]
