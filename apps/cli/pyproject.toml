[project]
name = "dotrix"
version = "0.1.0"
description = "dotrix terminal client and MCP server for Claude Code / Codex."
requires-python = ">=3.11"
dependencies = [
    "dotrix-engine",
    "typer",
    "mcp>=1.2",
    "httpx>=0.28.1",
    "keyring>=25",
]

[project.scripts]
dotrix = "dotrix_cli.cli:app"

[tool.uv.sources]
dotrix-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotrix_cli"]
