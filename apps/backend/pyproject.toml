[project]
name = "pmagent-backend"
version = "0.1.0"
description = "pmagent platform API: accounts, workspaces, projects, issues, approvals, .pmagent/ sync."
requires-python = ">=3.11"
dependencies = [
    "pmagent-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "uuid-utils>=0.17.1",
]

[tool.uv.sources]
pmagent-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmagent_backend"]
