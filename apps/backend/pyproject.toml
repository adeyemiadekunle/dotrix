[project]
name = "pmagent-backend"
version = "0.1.0"
description = "pmagent platform API: accounts, workspaces, projects, issues, approvals, .pmagent/ sync."
requires-python = ">=3.11"
dependencies = [
    "pmagent-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "uuid-utils>=0.17.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.0",
    "email-validator>=2",
    "aioboto3>=15.5.0",
    "python-multipart>=0.0.32",
    "deepagents>=0.7.19,<0.8",
    "langchain>=1.4",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "arq>=0.28",
    "httpx>=0.27",
    "pgvector>=0.5.0",
    "cryptography>=44",
]

[tool.uv.sources]
pmagent-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmagent_backend"]
