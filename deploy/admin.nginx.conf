# The admin console on its own origin. Only /v1/admin reaches the API: the app's web session and
# every other endpoint stay on the web app's origin — this origin is for whoever operates dotrix.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, looked up per request: nginx starts even while the API is still starting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Nobody frames the console (its buttons approve and push changes), and browsers don't guess types.
    # Repeated in each location below that sets a header of its own: nginx inherits add_header
    # only into locations that have none.
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/v1/admin(/|$) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Everything else that looks like an API path is off this origin.
    location ~ ^/(v1|api|health)(/|$) {
        return 404;
    }

    # Built files are named by their content: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Every other path is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
