# OpenShell provider profile for dotrix's coding runs with Kai on fx, on NVIDIA. Import it once per gateway:
#   openshell provider profile import -f infra/coding/dotrix-fx-nvidia.yaml --global
# Coding runs on fx with an NVIDIA model attach a provider of this type, made from the
# run's NVIDIA_API_KEY: the sandbox sees a placeholder, and OpenShell's proxy puts the key on requests to
# integrate.api.nvidia.com from fx only (fx-acp.mjs starts it; node itself never calls the model).
# Docker uses its selected-host egress proxy instead. Not yet exercised on a live OpenShell gateway.
id: dotrix-fx-nvidia
display_name: fx on NVIDIA (dotrix)
description: fx CLI on NVIDIA models, for dotrix coding runs
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA API key used by fx
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/fx
