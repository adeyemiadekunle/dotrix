# Import with openshell provider profile import -f infra/coding/dotrix-opencode-xai.yaml --global
# Docker uses its selected-host egress proxy. This profile is for OpenShell gateways.
# Not yet exercised on a live OpenShell gateway.
id: dotrix-opencode-xai
display_name: OpenCode on xAI (Grok) (dotrix)
description: OpenCode CLI on xAI (Grok) models, for dotrix coding runs
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: xAI (Grok) API key used by OpenCode
    env_vars: [XAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.x.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/opencode
  - /usr/local/lib/node_modules/@opencode/**
