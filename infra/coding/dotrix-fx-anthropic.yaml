# OpenShell provider profile for dotrix's coding runs with Kai on fx, on Anthropic. Import it once per gateway:
#   openshell provider profile import -f infra/coding/dotrix-fx-anthropic.yaml --global
# Coding runs on fx with an Anthropic model attach a provider of this type, made from the
# run's ANTHROPIC_API_KEY: the sandbox sees a placeholder, and OpenShell's proxy puts the key on requests to
# api.anthropic.com from fx only (fx-acp.mjs starts it; node itself never calls the model).
# Docker uses its selected-host egress proxy instead. Not yet exercised on a live OpenShell gateway.
id: dotrix-fx-anthropic
display_name: fx on Anthropic (dotrix)
description: fx CLI on Anthropic models, for dotrix coding runs
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: Anthropic API key used by fx
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/fx
