# OpenShell provider profile for dotrix's coding runs with Kai on fx, on OpenAI. Import it once per gateway:
#   openshell provider profile import -f infra/coding/dotrix-fx-openai.yaml --global
# Coding runs on fx (DOTRIX_CODING_FX=true) with a OpenAI model attach a provider of this type, made from the
# run's OPENAI_API_KEY: the sandbox sees a placeholder, and OpenShell's proxy puts the key on requests to
# api.openai.com from fx only (fx-acp.mjs starts it; node itself never calls the model).
# Docker uses its selected-host egress proxy instead. Not yet exercised on a live OpenShell gateway.
id: dotrix-fx-openai
display_name: fx on OpenAI (dotrix)
description: fx CLI on OpenAI models, for dotrix coding runs
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key used by fx
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/fx
