# dotrix itself in Docker for development, on top of infra/docker-compose.yml (the same Postgres,
# Redis and MinIO, the same data): `pnpm docker:up`, then http://localhost:3080.
# Set DOTRIX_DOCKER_WEB_PORT=3000 to keep the native web address; the API stays on :8000
# (DOTRIX_DOCKER_API_PORT overrides it). These ports are bound to localhost only.
#
#   migrate  applies the migrations, then exits
#   api      the API, restarted on changes to apps/backend/src and packages/engine/src (mounted)
#   worker   agent runs and jobs (DOTRIX_JOBS=worker), the same code
#   web      the built web app behind nginx, which forwards /v1, /api and /health to the API, as
#            in production (deploy/web.Dockerfile); rebuild it after web changes: `pnpm docker:web`
#
# Settings come from the repo-root .env; only addresses that differ inside Docker are set here.
# The package scripts pass --project-directory . from the repo root, so relative paths (including
# DOTRIX_GITHUB_APP_PRIVATE_KEY_PATH) are resolved from there. Absolute key paths work too.
# Point the CLI at it with `--api-url http://localhost:3080`. GitHub sign-in and the app's install
# need http://localhost:3080 among the GitHub App's callback and setup URLs.

x-backend: &backend
  build: { context: ., dockerfile: deploy/backend.Dockerfile }
  image: dotrix-backend:dev
  restart: unless-stopped
  env_file: .env
  environment: &backend-env # The password apart (asyncpg and libpq both read PGPASSWORD), never written into the URL.
    DOTRIX_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dotrix}@postgres:5432/${POSTGRES_DB:-dotrix}
    PGPASSWORD: ${POSTGRES_PASSWORD:?}
    DOTRIX_REDIS_URL: redis://redis:6379/0
    DOTRIX_S3_ENDPOINT_URL: http://minio:9000
    DOTRIX_APP_URL: http://localhost:${DOTRIX_DOCKER_WEB_PORT:-3080}
    DOTRIX_WEB_URL: http://localhost:${DOTRIX_DOCKER_WEB_PORT:-3080}
    DOTRIX_CORS_ORIGINS: '["http://localhost:${DOTRIX_DOCKER_WEB_PORT:-3080}"]'
    DOTRIX_JOBS: worker
    DOTRIX_CODE_DIR: /data/code
    DOTRIX_CODING_SANDBOX: ${DOTRIX_CODING_SANDBOX:-docker}
    DOTRIX_CODING_IMAGE: dotrix-coding:latest
    DOTRIX_GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-key
    # nginx in front of the API, on Docker's network.
    DOTRIX_TRUSTED_PROXIES: '["172.16.0.0/12"]'
    # Changes on a Windows or macOS host don't reach the container as file events.
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - codecache:/data/code
    - ./apps/backend/src:/app/apps/backend/src:ro
    - ./apps/backend/migrations:/app/apps/backend/migrations:ro
    - ./packages/engine/src:/app/packages/engine/src:ro
    - type: bind
      source: ${DOTRIX_GITHUB_APP_PRIVATE_KEY_PATH:-/dev/null}
      target: /run/secrets/github-app-key
      read_only: true
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    minio: { condition: service_started }

services:
  migrate:
    <<: *backend
    working_dir: /app/apps/backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    command: ["python", "-m", "dotrix_backend.serve", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["127.0.0.1:${DOTRIX_DOCKER_API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      DOCKER_HOST: tcp://docker-proxy:2375
    networks: [default, docker-control]
    command: ["python", "-m", "dotrix_backend.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      coding-image: { condition: service_completed_successfully }
      docker-proxy: { condition: service_started }

  coding-image:
    image: dotrix-coding:latest
    build: { context: ./infra/coding }
    command: ["true"]
    restart: "no"

  # Only the worker can reach this restricted Docker API; neither API nor web gets the socket.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    networks: [docker-control]
    environment:
      CONTAINERS: 1
      EXEC: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      POST: 1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    image: dotrix-web:dev
    restart: unless-stopped
    ports: ["127.0.0.1:${DOTRIX_DOCKER_WEB_PORT:-3080}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      api: { condition: service_healthy }

volumes:
  codecache:

networks:
  docker-control:
    internal: true
