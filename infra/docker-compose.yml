# Local services for the platform backend: `docker compose -f infra/docker-compose.yml up -d`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pmagent
      POSTGRES_PASSWORD: pmagent
      POSTGRES_DB: pmagent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
