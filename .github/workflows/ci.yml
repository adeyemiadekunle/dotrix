name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        # Throwaway container reachable only from this runner: trust auth, no password.
        env:
          POSTGRES_USER: pmagent
          POSTGRES_DB: pmagent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pmagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PMAGENT_DATABASE_URL: postgresql+asyncpg://pmagent@localhost:5432/pmagent
      PMAGENT_TEST_DATABASE_URL: postgresql+asyncpg://pmagent@localhost:5432/pmagent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check apps packages
      - run: uv run pytest
      - name: OpenAPI schema is up to date (run `pnpm openapi` if this fails)
        run: |
          uv run python apps/backend/scripts/export_openapi.py
          git diff --exit-code packages/api-client/openapi.json
      - name: Migrations apply cleanly and match the models
        working-directory: apps/backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

  cli-install:
    # The CLI must install and run on its own, outside the workspace, on Linux and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the CLI as a standalone tool (from this PR's code)
        run: uv tool install ./apps/cli
      - name: It runs
        shell: bash
        run: |
          bin="$(uv tool dir --bin)"
          # Git Bash on Windows needs a /c/... path: "C:/..." would split PATH at the colon.
          if command -v cygpath > /dev/null; then bin="$(cygpath -u "$bin")"; fi
          export PATH="$bin:$PATH"
          pmagent --help
          pmagent issue --help > /dev/null
          out="$(pmagent whoami 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "Not signed in"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API client matches the schema (run `pnpm openapi` if this fails)
        run: |
          pnpm --filter @pmagent/api-client generate
          git diff --exit-code packages/api-client/src/schema.ts
      - run: pnpm build
      - run: pnpm typecheck
