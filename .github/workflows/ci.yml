name: CI
on:
  push:
    branches: [main, stage]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.scope.outputs.components }}
      python: ${{ steps.scope.outputs.python }}
      python_targets: ${{ steps.scope.outputs.python_targets }}
      node: ${{ steps.scope.outputs.node }}
      node_filters: ${{ steps.scope.outputs.node_filters }}
      cli: ${{ steps.scope.outputs.cli }}
      e2e: ${{ steps.scope.outputs.e2e }}
      contract: ${{ steps.scope.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/affected.py --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  guards:
    # Always emitted, including documentation-only PRs: no pending required checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec eslint .
      - run: uv run --locked --only-group dev ruff check apps packages scripts
      - run: python3 scripts/check_boundaries.py
      - run: node scripts/check-boundaries.mjs
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: node --test scripts/tests/*.test.mjs

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'

    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie # Postgres 17 + pgvector, like infra/docker-compose.yml
        # Throwaway container reachable only from this runner: trust auth, no password.
        env:
          POSTGRES_USER: dotrix
          POSTGRES_DB: dotrix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTRIX_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix
      DOTRIX_TEST_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix_test
      DOTRIX_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Python packages (run `uv lock` if this fails)
        run: uv sync --locked
      - name: Install the fx runtime's host
        # The Kai runtime (@kunemi-group/kai) is on GitHub Packages: KAI_PACKAGES_TOKEN holds a token with read:packages.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.KAI_PACKAGES_TOKEN }}
        run: npm ci --prefix packages/engine/src/dotrix_engine/runtimes/fx_host
      - run: uv run ruff check apps packages
      - name: Test affected Python packages
        env:
          PYTHON_TARGETS: ${{ needs.changes.outputs.python_targets }}
        run: |
          read -r -a targets <<< "$PYTHON_TARGETS"
          uv run pytest "${targets[@]}"
      - name: fx delegation handoff
        if: contains(fromJSON(needs.changes.outputs.components), 'engine') || contains(fromJSON(needs.changes.outputs.components), 'backend')
        run: node --test packages/engine/src/dotrix_engine/runtimes/fx_host/handoff.test.mjs
      - name: Migrations apply cleanly and match the models
        if: contains(fromJSON(needs.changes.outputs.components), 'backend')
        working-directory: apps/backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

  cli-install:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    # The CLI must install and run on its own, outside the workspace, on Linux and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install the CLI as a standalone tool (from this PR's code)
        run: uv tool install ./apps/cli
      - name: It runs
        shell: bash
        run: |
          bin="$(uv tool dir --bin)"
          # Git Bash on Windows needs a /c/... path: "C:/..." would split PATH at the colon.
          if command -v cygpath > /dev/null; then bin="$(cygpath -u "$bin")"; fi
          export PATH="$bin:$PATH"
          dotrix --help
          dotrix issue --help > /dev/null
          out="$(dotrix whoami 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "Not signed in"

  cli-windows:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python packages
        run: uv sync --locked
      - name: Run CLI native sandbox and worktree tests on Windows
        run: uv run pytest apps/cli/tests/test_fx_native.py apps/cli/tests/test_runner.py -q

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: needs.changes.outputs.contract == 'true'
      - name: API client matches the schema (run `pnpm openapi` if this fails)
        if: needs.changes.outputs.contract == 'true'
        run: |
          uv run python apps/backend/scripts/export_openapi.py
          git diff --exit-code packages/api-client/openapi.json
          pnpm --filter @dotrix/api-client generate
          git diff --exit-code packages/api-client/src/schema.ts
      - name: Build and test affected packages and their build dependencies
        if: needs.changes.outputs.node == 'true'
        env:
          NODE_FILTERS: ${{ needs.changes.outputs.node_filters }}
        run: |
          read -r -a filters <<< "$NODE_FILTERS"
          pnpm build "${filters[@]}"
          pnpm typecheck "${filters[@]}"
          pnpm test "${filters[@]}"
      - name: Unused files and dependencies
        if: needs.changes.outputs.node == 'true'
        run: pnpm knip --include files,dependencies,unlisted,unresolved,binaries
      - name: Unused exports (report only)
        if: needs.changes.outputs.node == 'true'
        run: pnpm knip --no-exit-code --include exports,types

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # The web app in a real browser against a real backend: throwaway database, and the
    # deterministic "e2e:rules" model so agent runs need no API key (apps/web/e2e).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie # Postgres 17 + pgvector, like infra/docker-compose.yml
        env:
          POSTGRES_USER: dotrix
          POSTGRES_DB: dotrix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTRIX_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix
      DOTRIX_E2E_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python packages (run `uv lock` if this fails)
        run: uv sync --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dotrix/api-client build
      - name: Install the browser
        # --with-deps adds fonts with apt; when Ubuntu's mirror can't be reached that fails the job before any
        # test runs, though the runner image already has the libraries Chromium needs. So: try it for 3 minutes,
        # then install the browser alone.
        run: |
          timeout 180 pnpm --filter @dotrix/web exec playwright install --with-deps chromium \
            || pnpm --filter @dotrix/web exec playwright install chromium
      - run: pnpm --filter @dotrix/web e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  checks:
    # Use this stable aggregate as the required check in branch protection.
    if: always()
    needs: [changes, guards, python, cli-install, node, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All selected checks passed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          if failed:
              sys.exit('Failed or cancelled checks: ' + ', '.join(failed))
          print('All required and affected checks passed')
          PY
