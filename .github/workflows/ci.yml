name: CI
on:
  push:
    branches: [main, stage]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie # Postgres 17 + pgvector, like infra/docker-compose.yml
        # Throwaway container reachable only from this runner: trust auth, no password.
        env:
          POSTGRES_USER: dotrix
          POSTGRES_DB: dotrix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTRIX_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix
      DOTRIX_TEST_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix_test
      DOTRIX_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install Python packages (run `uv lock` if this fails)
        run: uv sync --locked
      - name: Install the fx runtime's host
        run: npm ci --prefix packages/engine/src/dotrix_engine/runtimes/fx_host
      - run: uv run ruff check apps packages
      - run: uv run pytest
      - name: fx delegation handoff
        run: node --test packages/engine/src/dotrix_engine/runtimes/fx_host/handoff.test.mjs
      - name: OpenAPI schema is up to date (run `pnpm openapi` if this fails)
        run: |
          uv run python apps/backend/scripts/export_openapi.py
          git diff --exit-code packages/api-client/openapi.json
      - name: Migrations apply cleanly and match the models
        working-directory: apps/backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

  cli-install:
    # The CLI must install and run on its own, outside the workspace, on Linux and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install the CLI as a standalone tool (from this PR's code)
        run: uv tool install ./apps/cli
      - name: It runs
        shell: bash
        run: |
          bin="$(uv tool dir --bin)"
          # Git Bash on Windows needs a /c/... path: "C:/..." would split PATH at the colon.
          if command -v cygpath > /dev/null; then bin="$(cygpath -u "$bin")"; fi
          export PATH="$bin:$PATH"
          dotrix --help
          dotrix issue --help > /dev/null
          out="$(dotrix whoami 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "Not signed in"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API client matches the schema (run `pnpm openapi` if this fails)
        run: |
          pnpm --filter @dotrix/api-client generate
          git diff --exit-code packages/api-client/src/schema.ts
      - name: Formatted with Prettier (run `pnpm format` if this fails)
        run: pnpm format:check
      - name: ESLint (run `pnpm lint:fix` for what it can fix)
        run: pnpm exec eslint .
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Unused files and dependencies
        run: pnpm knip --include files,dependencies,unlisted,unresolved,binaries
      - name: Unused exports (report only)
        run: pnpm knip --no-exit-code --include exports,types

  e2e:
    # The web app in a real browser against a real backend: throwaway database, and the
    # deterministic "e2e:rules" model so agent runs need no API key (apps/web/e2e).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie # Postgres 17 + pgvector, like infra/docker-compose.yml
        env:
          POSTGRES_USER: dotrix
          POSTGRES_DB: dotrix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTRIX_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix
      DOTRIX_E2E_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install Python packages (run `uv lock` if this fails)
        run: uv sync --locked
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dotrix/api-client build
      - name: Install the browser
        # --with-deps adds fonts with apt; when Ubuntu's mirror can't be reached that fails the job before any
        # test runs, though the runner image already has the libraries Chromium needs. So: try it for 3 minutes,
        # then install the browser alone.
        run: |
          timeout 180 pnpm --filter @dotrix/web exec playwright install --with-deps chromium \
            || pnpm --filter @dotrix/web exec playwright install chromium
      - run: pnpm --filter @dotrix/web e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
