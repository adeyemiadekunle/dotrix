name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        # Throwaway container reachable only from this runner: trust auth, no password.
        env:
          POSTGRES_USER: pmagent
          POSTGRES_DB: pmagent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pmagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PMAGENT_DATABASE_URL: postgresql+asyncpg://pmagent@localhost:5432/pmagent
      PMAGENT_TEST_DATABASE_URL: postgresql+asyncpg://pmagent@localhost:5432/pmagent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check apps packages
      - run: uv run pytest
      - name: OpenAPI schema is up to date (run `pnpm openapi` if this fails)
        run: |
          uv run python apps/backend/scripts/export_openapi.py
          git diff --exit-code packages/api-client/openapi.json
      - name: Migrations apply cleanly and match the models
        working-directory: apps/backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API client matches the schema (run `pnpm openapi` if this fails)
        run: |
          pnpm --filter @pmagent/api-client generate
          git diff --exit-code packages/api-client/src/schema.ts
      - run: pnpm build
      - run: pnpm typecheck
