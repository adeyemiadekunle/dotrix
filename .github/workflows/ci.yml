name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie # Postgres 17 + pgvector, like infra/docker-compose.yml
        # Throwaway container reachable only from this runner: trust auth, no password.
        env:
          POSTGRES_USER: dotrix
          POSTGRES_DB: dotrix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTRIX_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix
      DOTRIX_TEST_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix_test
      DOTRIX_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check apps packages
      - run: uv run pytest
      - name: OpenAPI schema is up to date (run `pnpm openapi` if this fails)
        run: |
          uv run python apps/backend/scripts/export_openapi.py
          git diff --exit-code packages/api-client/openapi.json
      - name: Migrations apply cleanly and match the models
        working-directory: apps/backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

  cli-install:
    # The CLI must install and run on its own, outside the workspace, on Linux and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the CLI as a standalone tool (from this PR's code)
        run: uv tool install ./apps/cli
      - name: It runs
        shell: bash
        run: |
          bin="$(uv tool dir --bin)"
          # Git Bash on Windows needs a /c/... path: "C:/..." would split PATH at the colon.
          if command -v cygpath > /dev/null; then bin="$(cygpath -u "$bin")"; fi
          export PATH="$bin:$PATH"
          dotrix --help
          dotrix issue --help > /dev/null
          out="$(dotrix whoami 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "Not signed in"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API client matches the schema (run `pnpm openapi` if this fails)
        run: |
          pnpm --filter @dotrix/api-client generate
          git diff --exit-code packages/api-client/src/schema.ts
      - name: Formatted with Prettier (run `pnpm format` if this fails)
        run: pnpm format:check
      - name: ESLint (run `pnpm lint:fix` for what it can fix)
        run: pnpm exec eslint .
      - run: pnpm build
      - run: pnpm typecheck

  e2e:
    # The web app in a real browser against a real backend: throwaway database, and the
    # deterministic "e2e:rules" model so agent runs need no API key (apps/web/e2e).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie # Postgres 17 + pgvector, like infra/docker-compose.yml
        env:
          POSTGRES_USER: dotrix
          POSTGRES_DB: dotrix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTRIX_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix
      DOTRIX_E2E_DATABASE_URL: postgresql+asyncpg://dotrix@localhost:5432/dotrix_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dotrix/api-client build
      - run: pnpm --filter @dotrix/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dotrix/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
