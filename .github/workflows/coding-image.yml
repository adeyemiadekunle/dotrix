name: Coding image
# Kai's sandbox image (infra/coding), published to a registry for Docker Cloud sandboxes to pull
# (DOTRIX_CODING_SANDBOX=docker-cloud). Runs for each release, or by hand. Needs the repository
# variable CODING_IMAGE (e.g. docker.io/acme/dotrix-coding) and the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (a token that may push to it); without them it says so and publishes nothing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.CODING_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - name: Configured?
        id: configured
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$IMAGE" ] || [ -z "$USERNAME" ]; then
            echo "::warning::Set the CODING_IMAGE variable and the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets to publish the coding image"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            # A release's tag (v0.1.0 -> 0.1.0); by hand, the commit.
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then tag="${GITHUB_REF_NAME#v}"; else tag="sha-${GITHUB_SHA::12}"; fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: steps.configured.outputs.ok == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.configured.outputs.ok == 'true'
      - uses: docker/build-push-action@v6
        if: steps.configured.outputs.ok == 'true'
        with:
          context: infra/coding
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.configured.outputs.version }}
            ${{ env.IMAGE }}:latest
