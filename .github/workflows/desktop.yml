name: Desktop and CLI builds
# The Windows desktop installer (NSIS, with the dotrix CLI bundled for local coding) and the standalone
# Windows CLI, built on Windows (PyInstaller doesn't cross-compile). For a release, both are attached to
# it; on a pull request that touches them, or by hand, they're kept as the run's artifacts.
# A release opens and talks to the repository variable DOTRIX_APP_URL (e.g. https://dotrix.example.com).
# Unsigned for now: Windows SmartScreen warns on first run. macOS comes later.
# Installed apps update themselves from the latest release (electron-updater, the `publish` settings in
# apps/desktop/package.json): so a release also carries latest.yml and the installer's .blockmap.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - apps/desktop/**
      - apps/cli/**
      - CHANGELOG.md
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read # the build only; the job that attaches to a release has its own write access

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # A pull request builds against a placeholder address; a release needs the real one.
      DOTRIX_WEB_URL: ${{ vars.DOTRIX_APP_URL || (github.event_name != 'release' && 'https://dotrix.example.com' || '') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The address it opens
        run: |
          if [ -z "$DOTRIX_WEB_URL" ]; then
            echo "::error::Set the repository variable DOTRIX_APP_URL (the https:// address of dotrix) to build a release"
            exit 1
          fi
          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building $version for $DOTRIX_WEB_URL"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The standalone CLI
        run: uv run --no-project python apps/cli/scripts/standalone.py --api-url "$DOTRIX_WEB_URL"
      - name: It runs, and talks to that server by default
        run: |
          ./apps/desktop/resources/dotrix/dotrix.exe --help > /dev/null
          ./apps/desktop/resources/dotrix/dotrix.exe whoami --json 2> whoami.txt || true
          cat whoami.txt
      - name: Zip the CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path apps/desktop/resources/dotrix/* -DestinationPath "out/dotrix-cli-$env:VERSION-windows-x64.zip"

      - name: The desktop installer
        run: pnpm --filter @dotrix/desktop dist:win
      - name: Collect
        run: cp apps/desktop/release/*-setup.exe apps/desktop/release/*-setup.exe.blockmap apps/desktop/release/latest.yml out/ && ls -la out
      - name: The update feed names this installer
        run: grep -q "dotrix-$VERSION-windows-x64-setup.exe" out/latest.yml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotrix-windows-x64
          path: out/*
          if-no-files-found: error

  attach:
    # Only a published release gets write access, and only this job has it: pull requests build with read-only contents.
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaching the builds to the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dotrix-windows-x64
          path: out
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
