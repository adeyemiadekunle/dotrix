# uv workspace root (virtual: not itself a package).
# Members: the agent engine, the `pmagent` CLI, and the platform backend.
[project]
name = "pmagent-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pmagent-engine", "pmagent", "pmagent-backend"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/engine", "apps/cli", "apps/backend"]

[tool.uv.sources]
pmagent-engine = { workspace = true }
pmagent = { workspace = true }
pmagent-backend = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.9",
    "httpx>=0.27",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit so a Ruff upgrade can't silently change what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer declares CLI options as function-call defaults

[tool.ruff.lint.isort]
known-first-party = ["pmagent_engine", "pmagent_cli", "pmagent_backend"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests", "apps/cli/tests", "apps/backend/tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
